{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Update Delivery</h2>

    <form method="POST"
          action="{{ url_for('edit_delivery', delivery_id=delivery.id) }}">

        <div class="mb-3">
            <label>Pickup Address</label>
            <input type="text" name="pickup_address" class="form-control"
                   value="{{ delivery.pickup_address }}" required>
        </div>

        <div class="mb-3">
            <label>Delivery Address</label>
            <input type="text" name="delivery_address" class="form-control"
                   value="{{ delivery.delivery_address }}" required>
        </div>

        <div class="mb-3">
            <label>Goods Description</label>
            <input type="text" name="goods_description" class="form-control"
                   value="{{ delivery.goods_description }}" required>
        </div>

        <div class="mb-3">
            <label>Requested Date</label>
            <input type="date" name="requested_date" class="form-control"
                   value="{{ delivery.requested_date or '' }}"
                   min="{{ today }}">
        </div>

        <div class="mb-3">
            <label>Delivery Deadline</label>
            <input type="date" name="delivery_deadline" class="form-control"
                   value="{{ delivery.delivery_deadline or '' }}"
                   min="{{ today }}">
        </div>

        <div class="mb-3">
            <label>Weight (kg)</label>
            <input type="number" step="0.01" min="0.01"
                   name="weight_kg" class="form-control"
                   value="{{ delivery.weight_kg }}" required>
        </div>

        <div class="mb-3">
            <label>Volume (m³)</label>
            <input type="number" step="0.01" min="0.01"
                   name="volume_m3" class="form-control"
                   value="{{ delivery.volume_m3 }}" required>
        </div>

        <div class="mb-3">
            <label>Priority</label>
            <select name="priority" class="form-control" required>
                {% for p in ['Low', 'Normal', 'High', 'Urgent'] %}
                <option value="{{ p }}"
                    {% if delivery.priority == p %}selected{% endif %}>
                    {{ p }}
                </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a href="{{ url_for('user_deliveries') }}"
           class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
